spring.application.name=event-server
server.port=0

# Eureka Client configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Actuator health endpoint exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

# Info endpoint properties
info.app.name=event-server
info.app.description=Event server microservice
info.app.version=0.0.1-SNAPSHOT

# Datasource (Neon PostgreSQL)
spring.datasource.url=jdbc:postgresql://ep-sweet-bread-bhc4du6w-pooler.c-10.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_sqEdNtCbM75R

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-query=SELECT 1
