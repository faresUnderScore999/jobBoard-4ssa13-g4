# ===== Identité du service =====
spring.application.name=consultation-service
server.port=8084

# ===== Base de données H2 (en mémoire, rien à installer) =====
spring.datasource.url=jdbc:h2:mem:consultationdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Client Eureka (les deux serveurs Eureka) =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://127.0.0.1:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===== Informations affichées dans /actuator/info =====
info.app.name=consultation-service
info.app.description=Gestion des rendez-vous avec les specialistes
info.app.version=0.0.1-SNAPSHOT